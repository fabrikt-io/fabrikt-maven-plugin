openapi: 3.0.3
info:
  title: Shared composition contracts
  version: 1.0.0
paths: {}
components:
  schemas:
    A:
      type: object
      required: [id]
      properties:
        id:
          type: string
    B:
      allOf:
        - $ref: '#/components/schemas/A'
        - type: object
          required: [label]
          properties:
            label:
              type: string
    Parent:
      type: object
      required: [kind, name]
      discriminator:
        propertyName: kind
        mapping:
          child: '#/components/schemas/Child'
      properties:
        kind:
          type: string
        name:
          type: string
    Child:
      allOf:
        - $ref: '#/components/schemas/Parent'
        - type: object
          required: [value]
          properties:
            value:
              type: string
