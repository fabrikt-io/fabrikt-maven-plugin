name: Release in lockstep with Fabrikt

on:
  repository_dispatch:
    types: [fabrikt-released]
  workflow_dispatch:
    inputs:
      version:
        description: Released Fabrikt version
        required: true
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: fabrikt-lockstep-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Fabrikt version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
        run: |
          VERSION="${INPUT_VERSION:-$DISPATCH_VERSION}"
          if [[ -z "$VERSION" ]]; then
            VERSION=$(gh api repos/fabrikt-io/fabrikt/releases/latest --jq .tag_name)
          fi
          VERSION="${VERSION#refs/tags/}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Fabrikt version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already-released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Fabrikt in Maven Central
        id: artifact
        if: steps.version.outputs.already-released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          URL="https://repo1.maven.org/maven2/io/fabrikt/fabrikt/$VERSION/fabrikt-$VERSION.pom"
          if curl --fail --silent --show-error --retry 30 --retry-delay 60 --retry-all-errors "$URL" >/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            PLUGIN_URL="https://repo1.maven.org/maven2/io/fabrikt/fabrikt-maven-plugin/$VERSION/fabrikt-maven-plugin-$VERSION.pom"
            if curl --fail --silent "$PLUGIN_URL" >/dev/null; then
              echo "plugin-published=true" >> "$GITHUB_OUTPUT"
            else
              echo "plugin-published=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            echo "Fabrikt $VERSION is not available from Maven Central yet; the next scheduled run will retry."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - uses: actions/setup-java@v4
        if: steps.artifact.outputs.available == 'true' && steps.artifact.outputs.plugin-published == 'false'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build and test against Fabrikt
        if: steps.artifact.outputs.available == 'true' && steps.artifact.outputs.plugin-published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./gradlew clean build -PfabriktVersion="$VERSION"

      - name: Record existing staging repositories
        id: staging_before
        if: steps.artifact.outputs.available == 'true' && steps.artifact.outputs.plugin-published == 'false'
        env:
          OSSRH_USER_TOKEN_USERNAME: ${{ secrets.OSSRH_USER_TOKEN_USERNAME }}
          OSSRH_USER_TOKEN_PASSWORD: ${{ secrets.OSSRH_USER_TOKEN_PASSWORD }}
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            -u "$OSSRH_USER_TOKEN_USERNAME:$OSSRH_USER_TOKEN_PASSWORD" \
            "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=any&profile_id=io.fabrikt")
          echo "keys=$(jq -c '[.repositories[] | select(.state == "open") | .key]' <<< "$RESPONSE")" >> "$GITHUB_OUTPUT"

      - name: Publish plugin to Maven Central staging
        if: steps.artifact.outputs.available == 'true' && steps.artifact.outputs.plugin-published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          OSSRH_USER_TOKEN_USERNAME: ${{ secrets.OSSRH_USER_TOKEN_USERNAME }}
          OSSRH_USER_TOKEN_PASSWORD: ${{ secrets.OSSRH_USER_TOKEN_PASSWORD }}
        run: >-
          ./gradlew
          -PfabriktVersion="$VERSION"
          -PsigningKey='${{ secrets.GPG_SIGNING_KEY }}'
          -PsigningPassword='${{ secrets.GPG_SIGNING_PASSWORD }}'
          publishMavenPluginPublicationToCentralStagingRepository

      - name: Register deployment with Central Publisher Portal
        if: steps.artifact.outputs.available == 'true' && steps.artifact.outputs.plugin-published == 'false'
        env:
          OSSRH_USER_TOKEN_USERNAME: ${{ secrets.OSSRH_USER_TOKEN_USERNAME }}
          OSSRH_USER_TOKEN_PASSWORD: ${{ secrets.OSSRH_USER_TOKEN_PASSWORD }}
          PREVIOUS_KEYS: ${{ steps.staging_before.outputs.keys }}
        run: |
          sleep 60
          RESPONSE=$(curl --fail --silent --show-error \
            -u "$OSSRH_USER_TOKEN_USERNAME:$OSSRH_USER_TOKEN_PASSWORD" \
            "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=any&profile_id=io.fabrikt")
          REPO_KEY=$(jq --argjson previous "$PREVIOUS_KEYS" -r \
            '[.repositories[] | select(.state == "open") | .key] - $previous | last // empty' <<< "$RESPONSE")
          if [[ -z "$REPO_KEY" ]]; then
            echo "No open io.fabrikt staging repository was found" >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST -H "Accept: application/json" \
            -u "$OSSRH_USER_TOKEN_USERNAME:$OSSRH_USER_TOKEN_PASSWORD" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/repository/$REPO_KEY"

      - name: Create matching GitHub release
        if: steps.artifact.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes --title "$VERSION"
